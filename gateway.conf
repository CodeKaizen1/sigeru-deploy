# Reparte el tráfico entre los 2 contenedores reales (web = las 3 APIs
# PHP de sigeru-backend, frontend = los 3 sitios estáticos de
# sigeru-frontend), para que el navegador vea todo como un solo origen
# -- misma disposición de carpetas hermanas que ya usa XAMPP hoy
# (api-gestion/, api-recoleccion/, api-usuarios/, landing/,
# frontend-usuarios/, backoffice/, todas al mismo nivel).

server {
    listen 80;

    # Las 3 APIs reales -> contenedor "web" (Apache+PHP de sigeru-backend).
    location /api-usuarios/ {
        proxy_pass http://web/api-usuarios/;
        proxy_set_header Host $host;
    }

    location /api-gestion/ {
        proxy_pass http://web/api-gestion/;
        proxy_set_header Host $host;
    }

    location /api-recoleccion/ {
        proxy_pass http://web/api-recoleccion/;
        proxy_set_header Host $host;
    }

    # Todo lo demás (landing/, frontend-usuarios/, backoffice/, y la
    # raíz) -> contenedor "frontend" (nginx de sigeru-frontend).
    location / {
        proxy_pass http://frontend/;
        proxy_set_header Host $host;
    }
}
