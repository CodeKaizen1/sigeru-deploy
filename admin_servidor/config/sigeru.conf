#!/bin/bash
#
# config/sigeru.conf
# Configuración central del servidor SiGeRU.
# Es el UNICO archivo que hay que editar para adaptar el script a otro
# entorno (otra base de datos, otro servidor de respaldos, otras IPs).
#
# VARIANTE 07/11/2026 PARA LA INSTALACIÓN EN UNA SOLA VM (ESI Buceo):
# RESPALDO_HOST se deja vacío a propósito. Con RESPALDO_HOST="" el módulo
# de backup (modulos/backup.sh, ya adaptado) opera en modo local: genera,
# rota y verifica el .tar.gz en esta misma VM, sin intentar ninguna
# conexión SSH/rsync a un servidor de respaldos separado (no existe en
# este escenario de un solo host). Para volver al setup de 3 VMs de
# Administración de Sistemas Operativos, basta volver a poner la IP real
# en RESPALDO_HOST (por ejemplo "192.168.1.202") — el resto del script no
# cambia.

# --- Base de datos ----------------------------------------------------------
# DB_NAME y DB_USUARIO_BACKUP no cambian: la base sigue llamándose SiGeRU,
# esté en un contenedor Docker (db de sigeru-deploy) o en un MySQL instalado
# directo en la VM.
DB_NAME="SiGeRU"
DB_USUARIO_BACKUP="backup_user"
DB_ARCHIVO_CREDENCIALES="$HOME/.sigeru_backup.cnf"   # permisos 600, sin clave en el script

# --- Respaldos --------------------------------------------------------------
BACKUP_DIR_LOCAL="$HOME/backups_local"
BACKUP_LOG="$BACKUP_DIR_LOCAL/backup.log"

# NUEVO: vacío = modo local (instalación de una sola VM, sin servidor de
# respaldos separado). Para el setup de 3 VMs, volver a poner la IP real.
RESPALDO_USUARIO="fc"
RESPALDO_HOST=""
RESPALDO_DIR="/home/fc/backups"

# Política de retención (la definida en la Estrategia de Respaldo):
#   diarias: últimos 7 días | semanales (domingos): 4 semanas | mensuales (dia 1): 6 meses
# Se mantiene igual: la rotación LOCAL sigue aplicándose en modo local.
RETENCION_DIARIOS_DIAS=7
RETENCION_SEMANALES_DIAS=28
RETENCION_MENSUALES_DIAS=183

# Archivos y carpetas de configuración que se incluyen en el backup de configuración.
# En la VM única se agregan los archivos propios de sigeru-deploy (abajo), además
# de los del sistema operativo.
CONFIG_A_RESPALDAR=(/etc/ssh/sshd_config /etc/mysql /etc/netplan /etc/ufw /etc/fstab)

# --- Servidores del proyecto (IP|rol) ---------------------------------------
# En la instalación de una sola VM esto queda informativo únicamente (no se usa
# para conectividad real, ya que todo corre en el mismo host). Se deja para no
# perder la referencia a la arquitectura de 3 VMs de la otra entrega.
SERVIDORES=("192.168.1.200|Backend" "192.168.1.201|Base de datos" "192.168.1.202|Respaldo")
IP_BACKEND="192.168.1.200"

# --- Grupos base según los roles del sistema --------------------------------
GRUPOS_ROLES=(sigeru_admin sigeru_cuadrilla sigeru_operarios)

# --- Registro de acciones administrativas -----------------------------------
ADMIN_LOG="$HOME/admin_servidor.log"

# --- Instalación con Docker (sigeru-deploy) ---------------------------------
# Carpeta de sigeru-deploy (la del docker-compose.yml). Con esto definido, el
# módulo de bases de datos usa el contenedor "db" en vez de un MySQL local.
SIGERU_DEPLOY_DIR="$HOME/SiGeRU/sigeru-deploy"
# El contenedor "db" publica MySQL solo en 127.0.0.1:3306 de esta VM. Se
# guardan en ~/.sigeru_backup.cnf para que mysqldump se conecte por TCP (en la
# VM no hay socket local de MySQL: el servidor corre dentro del contenedor).
DB_HOST_BACKUP="127.0.0.1"
DB_PORT_BACKUP="3306"
