# sigeru-deploy (variante: base de datos LOCAL, instalación en una sola VM)
#
# Este NO es un repo de código: es el "pegamento" que une los 2 repos
# reales del proyecto (sigeru-backend y sigeru-frontend) para que se
# pueda levantar TODA LA APP (las 3 APIs + los 3 frontends + MySQL) con
# un solo "docker compose up", en una sola máquina/VM -- sin instalar
# PHP, Node ni MySQL a mano.
#
# DIFERENCIA con la variante de base externa (05/11/2026): esta versión
# vuelve a levantar su propio contenedor "db" (MySQL 8). Para la
# instalación de ESI Buceo se exige un solo host Linux con sus propios
# contenedores de app + BD + respaldo -- depender de la VM externa de
# un compañero agrega una dependencia de red que no hace falta acá.
#
# Por qué hace falta el contenedor "gateway" (nginx): sigeru-backend
# expone las 3 APIs y sigeru-frontend expone los 3 frontends, pero son 2
# proyectos Docker DISTINTOS. El código de los 3 frontends llama a las
# APIs con rutas relativas (ej. desde backoffice/admin.html,
# "../../api-gestion/index.php" resuelve a "/api-gestion/index.php" en
# el MISMO origen de la página) -- pensadas para cuando todo vive bajo
# el mismo htdocs de XAMPP, con las APIs como carpetas hermanas de los
# frontends. El gateway unifica todo bajo un solo origen/puerto (8090)
# sin tocar una sola línea de código de ninguno de los 2 repos.
#
# CÓMO USARLO (ver README.md de esta carpeta para el detalle completo):
#   1. Clonar/copiar los 3 repos como carpetas HERMANAS (mismo padre):
#        algunacarpeta/sigeru-backend
#        algunacarpeta/sigeru-frontend
#        algunacarpeta/sigeru-deploy   <- este
#   2. cd sigeru-deploy && cp .env.example .env
#      y completar MYSQL_ROOT_PASSWORD con una contraseña propia.
#   3. docker compose up --build
#   4. Abrir http://localhost:8090/landing/index.html
#      (o la IP/host de la VM en vez de localhost, según dónde se levante)

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Completá .env con una contraseña para MySQL}
      MYSQL_DATABASE: ${DB_NAME:-SiGeRU}
    volumes:
      # Volumen nombrado: los datos sobreviven a "docker compose down"/"up".
      - db-datos:/var/lib/mysql
      # Scripts de esquema + datos de prueba de sigeru-backend, se cargan
      # solos la primera vez que el volumen está vacío.
      - ../sigeru-backend/docker/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      # Publicado SOLO en loopback: permite que admin_servidor.sh (parado
      # en esta misma VM) haga mysqldump desde el host, sin exponer MySQL
      # hacia la red.
      - "127.0.0.1:3306:3306"
    restart: unless-stopped

  web:
    build:
      # Build context = la raíz de sigeru-backend (igual que su propio
      # docker-compose.yml), así el Dockerfile encuentra las 3 carpetas
      # de las APIs tal cual están en ese repo.
      context: ../sigeru-backend
      dockerfile: docker/Dockerfile
    environment:
      # Conexion.php (en cada una de las 3 APIs) las lee con getenv() --
      # no hace falta tocar ni una línea de código PHP. Apuntan al
      # contenedor "db" de arriba, no a una VM externa.
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-SiGeRU}
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD:?Completá .env con una contraseña para MySQL}
    volumes:
      - ../sigeru-backend:/var/www/html
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      # Build context = la raíz de sigeru-frontend (igual que su propio
      # docker-compose.yml).
      context: ../sigeru-frontend
      dockerfile: docker/Dockerfile
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    depends_on:
      - web
      - frontend
    ports:
      - "8090:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  db-datos:
